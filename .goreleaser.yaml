version: 2

project_name: vault-unsealer

before:
  hooks:
    - go mod tidy

builds:
  - id: vault-unsealer
    main: .
    binary: vault-unsealer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - AGENTS.md
      - LICENSE
      - examples/*

checksum:
  name_template: checksums.txt

# Generate a CycloneDX SBOM (via syft) for each archive.
sboms:
  - id: archive
    artifacts: archive

# Keyless (Sigstore) signing of the checksums file with cosign. Because every
# artifact is listed in checksums.txt, signing it transitively covers them all.
# In CI this uses GitHub OIDC (no long-lived keys); requires `id-token: write`.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"

release:
  draft: false
  prerelease: auto
  footer: >-
    ---

    Released with [GoReleaser](https://goreleaser.com).
